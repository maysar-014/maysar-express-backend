openapi: 3.0.3
info:
  title: Maysar Express Backend API
  version: 1.0.0
  description: Complete API contract for Maysar Express e-commerce platform
  contact:
    name: Maysar Express Team
    email: api@maysar.co.tz

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.maysar.co.tz
    description: Production

tags:
  - name: Health
    description: System health and readiness checks
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User management
  - name: Products
    description: Product catalog management
  - name: Search
    description: Product search and discovery
  - name: Pricing
    description: Pricing calculations and rules
  - name: Orders
    description: Order management
  - name: Checkout
    description: Checkout process
  - name: Payments
    description: Payment processing
  - name: Wallet
    description: Wallet and balance management
  - name: Inventory
    description: Inventory management
  - name: Logistics
    description: Delivery and logistics
  - name: Notifications
    description: Notification management
  - name: Analytics
    description: Analytics and reporting
  - name: Business
    description: Business registration
  - name: Commission
    description: Commission calculations
  - name: Community
    description: Community features
  - name: Training
    description: Training modules
  - name: Support
    description: Customer support
  - name: Enabler
    description: Enabler management

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Fast health check to verify service is running
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                  timestamp:
                    type: string
                    format: date-time
                  memoryUsage:
                    type: object

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: Checks if service and dependencies are ready
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                      redis:
                        type: string
        '503':
          description: Service not ready

  # ==================== AUTH SERVICE ====================
  /api/auth/login:
    post:
      tags: [Auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                totpCode:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      responses:
        '200':
          description: Token refreshed

  /api/auth/verify:
    get:
      tags: [Auth]
      summary: Verify session/token validity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token valid

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword, confirmPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: Password reset successful

  /api/auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totpCode]
              properties:
                password:
                  type: string
                totpCode:
                  type: string
      responses:
        '200':
          description: 2FA enabled

  /api/auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: 2FA disabled

  /api/auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Verify 2FA setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, totpCode]
              properties:
                secret:
                  type: string
                totpCode:
                  type: string
      responses:
        '200':
          description: 2FA verified

  # ==================== USER SERVICE ====================
  /api/user:
    post:
      tags: [Users]
      summary: Create new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: User created

  /api/user/profile:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
    put:
      tags: [Users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated

  /api/user/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
    put:
      tags: [Users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Delete user account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted

  /api/user/verify-email/{token}:
    post:
      tags: [Users]
      summary: Verify email address
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified

  /api/user/request-password-reset:
    post:
      tags: [Users]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Reset email sent

  /api/user/{id}/password:
    post:
      tags: [Users]
      summary: Change user password
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Password changed

  /api/user/{id}/suspend:
    post:
      tags: [Users]
      summary: Suspend user account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User suspended

  /api/user/{id}/role:
    post:
      tags: [Users]
      summary: Change user role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role changed

  /api/user/{userId}/cod-reputation:
    get:
      tags: [Users]
      summary: Get COD reputation
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: COD reputation data

  # ==================== CATALOG SERVICE ====================
  /api/catalog/api/v1/products:
    post:
      tags: [Products]
      summary: Create product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, categoryId]
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                categoryId:
                  type: string
                attributes:
                  type: object
      responses:
        '201':
          description: Product created

  /api/catalog/api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
    put:
      tags: [Products]
      summary: Update product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product updated
    delete:
      tags: [Products]
      summary: Delete product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted

  /api/catalog/api/v1/products/search:
    get:
      tags: [Search]
      summary: Search products
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Search results

  /api/catalog/api/v1/sellers/{sellerId}/products:
    get:
      tags: [Products]
      summary: Get products by seller
      description: Public endpoint for browsing seller products. Generates shareable URL like https://maysar.co.tz/seller/{sellerId}
      parameters:
        - name: sellerId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Seller products with metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  seller:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      shareUrl:
                        type: string
                        example: https://maysar.co.tz/seller/abc123
                  products:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object

  /api/catalog/api/v1/products/{id}/publish:
    post:
      tags: [Products]
      summary: Publish product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product published

  /api/catalog/api/v1/products/{id}/analytics:
    get:
      tags: [Products]
      summary: Get product analytics
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product analytics

  /api/catalog/api/v1/products/bulk:
    post:
      tags: [Products]
      summary: Bulk create products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                products:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Products created
    put:
      tags: [Products]
      summary: Bulk update products
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Products updated
    delete:
      tags: [Products]
      summary: Bulk delete products
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Products deleted

  /api/catalog/api/v1/categories/{categoryId}/attributes:
    get:
      tags: [Products]
      summary: Load category attributes
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category attributes

  /api/catalog/api/v1/search/suggestions:
    get:
      tags: [Search]
      summary: Get search suggestions
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Search suggestions

  /api/catalog/api/v1/search/popular:
    get:
      tags: [Search]
      summary: Get popular searches
      responses:
        '200':
          description: Popular searches

  /api/catalog/api/v1/pricing/calculate:
    post:
      tags: [Pricing]
      summary: Calculate product price
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Price calculated

  /api/catalog/api/v1/pricing/rules:
    get:
      tags: [Pricing]
      summary: Get pricing rules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pricing rules
    post:
      tags: [Pricing]
      summary: Create pricing rule
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Rule created

  /api/catalog/api/v1/pricing/analytics:
    get:
      tags: [Pricing]
      summary: Get pricing analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pricing analytics

  # ==================== ORDER SERVICE ====================
  /api/order/orders:
    post:
      tags: [Orders]
      summary: Place new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, shippingAddress]
              properties:
                items:
                  type: array
                  items:
                    type: object
                shippingAddress:
                  type: object
                paymentMethod:
                  type: string
      responses:
        '201':
          description: Order created
    get:
      tags: [Orders]
      summary: Get all orders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Orders list

  /api/order/orders/cod/validate:
    post:
      tags: [Orders]
      summary: Validate COD eligibility
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: COD validation result

  /api/order/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
    put:
      tags: [Orders]
      summary: Update order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order updated
    delete:
      tags: [Orders]
      summary: Cancel order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled

  /api/order/orders/tracking/{trackingNumber}:
    get:
      tags: [Orders]
      summary: Get order by tracking number
      security:
        - bearerAuth: []
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
        '400':
          description: Invalid tracking number
        '404':
          description: Order not found

  /api/order/orders/{id}/status:
    post:
      tags: [Orders]
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Status updated

  /api/order/orders/search:
    get:
      tags: [Orders]
      summary: Search orders
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Search results

  /api/order/orders/analytics/stats:
    get:
      tags: [Orders]
      summary: Get order analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order analytics

  /api/order/orders/disputes/{id}/resolve:
    post:
      tags: [Orders]
      summary: Resolve COD dispute
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dispute resolved

  # ==================== CHECKOUT SERVICE ====================
  /api/checkout/initiate:
    post:
      tags: [Checkout]
      summary: Initiate checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Checkout initiated

  /api/checkout/{id}:
    get:
      tags: [Checkout]
      summary: Get checkout session
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checkout session

  /api/checkout/{id}/confirm:
    post:
      tags: [Checkout]
      summary: Confirm checkout
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checkout confirmed

  # ==================== PAYMENT SERVICE ====================
  /api/payment:
    post:
      tags: [Payments]
      summary: Create payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, amount, method]
              properties:
                orderId:
                  type: string
                amount:
                  type: number
                method:
                  type: string
      responses:
        '201':
          description: Payment created

  /api/payment/{id}:
    get:
      tags: [Payments]
      summary: Get payment by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details

  /api/payment/order/{orderId}:
    get:
      tags: [Payments]
      summary: Get payment by order ID
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details

  /api/payment/{id}/status:
    get:
      tags: [Payments]
      summary: Check payment status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment status

  /api/payment/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund payment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refund processed

  /api/payment/webhooks/pesapal:
    post:
      tags: [Payments]
      summary: Pesapal webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

  # ==================== WALLET SERVICE ====================
  /api/wallet/{userId}:
    get:
      tags: [Wallet]
      summary: Get wallet
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wallet details

  /api/wallet/{userId}/balance:
    get:
      tags: [Wallet]
      summary: Get wallet balance
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wallet balance

  /api/wallet/{userId}/credit:
    post:
      tags: [Wallet]
      summary: Credit wallet
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
      responses:
        '200':
          description: Wallet credited

  /api/wallet/{userId}/debit:
    post:
      tags: [Wallet]
      summary: Debit wallet
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
      responses:
        '200':
          description: Wallet debited

  /api/wallet/{userId}/hold:
    post:
      tags: [Wallet]
      summary: Place hold on funds
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hold placed

  /api/wallet/{userId}/hold/{holdId}/release:
    post:
      tags: [Wallet]
      summary: Release hold
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: holdId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hold released

  /api/wallet/{userId}/hold/{holdId}/capture:
    post:
      tags: [Wallet]
      summary: Capture hold
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: holdId
          in: path
          required: true
          schema:
            type: string
