components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string

    Success:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

  # ==================== SELLER/SUPPLIER STOREFRONT ====================
  /api/catalog/api/v1/sellers/{sellerId}/storefront:
    get:
      tags: [Products]
      summary: Get seller storefront details
      description: Public endpoint for seller storefront with shareable URL generation
      parameters:
        - name: sellerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Seller storefront
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  logo:
                    type: string
                  shareUrl:
                    type: string
                    example: https://maysar.co.tz/seller/abc123
                  shortUrl:
                    type: string
                    example: https://maysar.co.tz/s/abc123
                  qrCode:
                    type: string
                    description: Base64 encoded QR code for the storefront
                  stats:
                    type: object
                    properties:
                      totalProducts:
                        type: integer
                      rating:
                        type: number

  /api/catalog/api/v1/sellers/{sellerId}/share-url:
    post:
      tags: [Products]
      summary: Generate shareable URL for seller
      description: Creates or retrieves shareable URL and QR code for seller storefront
      security:
        - bearerAuth: []
      parameters:
        - name: sellerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                includeQR:
                  type: boolean
                  default: true
                customSlug:
                  type: string
      responses:
        '200':
          description: Shareable URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareUrl:
                    type: string
                    example: https://maysar.co.tz/seller/abc123
                  shortUrl:
                    type: string
                    example: https://maysar.co.tz/s/abc123
                  qrCode:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
