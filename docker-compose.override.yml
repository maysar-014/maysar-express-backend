services:
  maysar-backend:
    build:
      target: dev # Keep devDependencies so `npm run dev` can run inside the container
    environment:
      NODE_ENV: development
      DEBUG: 'app:*'
      MEILISEARCH_API_KEY: dev-master-key
      ALLOW_MODULE_INIT_FAILURES: 'true'
      MODULE_INIT_TIMEOUT_MS: '15000'
      PORT: '3001'
    ports:
      - "3000:3001"
    volumes:
      - .:/app
      - /app/node_modules # Anonymous volume to protect container's node_modules
      - ./prisma:/app/prisma
    command: node -r ts-node/register/transpile-only -r dotenv/config -r tsconfig-paths/register src/main.ts
    restart: "no" # Don't restart in dev to see errors clearly

  postgres:
    ports:
      - "5433:5432" # Expose DB for local inspection tools (avoiding 5432 host conflict)

  redis:
    ports:
      - "6379:6379" # Expose Redis for local inspection tools

  meilisearch:
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev-master-key
    ports:
      - "7700:7700"

  mailpit:
    ports:
      - "1025:1025"
      - "8025:8025"
