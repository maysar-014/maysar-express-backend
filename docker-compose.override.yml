services:
  maysar-backend:
    build:
      target: builder # Use compiled app artifacts from the image for faster startup
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DEBUG: 'app:*'
      MEILISEARCH_API_KEY: dev-master-key
      ALLOW_MODULE_INIT_FAILURES: 'true'
      MODULE_INIT_TIMEOUT_MS: '15000'
      ENABLE_BACKGROUND_WORKERS: ${ENABLE_BACKGROUND_WORKERS:-false}
      ENABLE_OUTBOX_PROCESSOR: ${ENABLE_OUTBOX_PROCESSOR:-false}
      ENABLE_SAGA_RECOVERY: ${ENABLE_SAGA_RECOVERY:-false}
      DOCKER_DEV_MODE: ${DOCKER_DEV_MODE:-compiled}
      PORT: '3001'
    ports:
      - "3000:3001"
    command: node scripts/dev-container-start.js
    restart: "no" # Don't restart in dev to see errors clearly

  postgres:
    ports:
      - "5433:5432" # Expose DB for local inspection tools (avoiding 5432 host conflict)

  redis:
    ports:
      - "6379:6379" # Expose Redis for local inspection tools

  meilisearch:
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev-master-key
    ports:
      - "7700:7700"

  mailpit:
    ports:
      - "1025:1025"
      - "8025:8025"
