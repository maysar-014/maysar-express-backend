version: '3.8'

services:
  maysar-backend:
    build:
      target: builder # Use builder stage for development (source code access)
    environment:
      NODE_ENV: development
      DEBUG: 'app:*'
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules # Anonymous volume to protect container's node_modules
      - ./prisma:/app/prisma
    command: npm run dev
    restart: "no" # Don't restart in dev to see errors clearly

  postgres:
    ports:
      - "5433:5432" # Expose DB for local inspection tools (avoiding 5432 host conflict)

  redis:
    ports:
      - "6379:6379" # Expose Redis for local inspection tools
