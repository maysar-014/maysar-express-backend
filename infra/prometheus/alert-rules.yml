groups:
  - name: payment_service_alerts
    interval: 30s
    rules:
      - alert: PaymentFailureRateHigh
        expr: |
          rate(payment_service_payment_outcomes_total{status="failed"}[5m]) 
          / rate(payment_service_payment_outcomes_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Payment failure rate exceeds 5%
          description: "Payment failure rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: PaymentReconciliationDrift
        expr: absent(payment_service_payments_processed_total)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Reconciliation metric absent / stale
          description: "Payment reconciliation metric has been absent for 5 minutes"

      - alert: DBConnectionPoolExhausted
        expr: |
          maysar_express_backend_database_errors_total > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DB experiencing high error rate
          description: "Database errors exceeded 10 in the last 2 minutes (current: {{ $value }})"

      - alert: PodRestartSurge
        expr: increase(container_status_restarts_total{namespace="maysar"}[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Pod restarted > 3× in 15 min
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

      - alert: HTTPErrorRateHigh
        expr: |
          rate(payment_service_http_requests_total{status_code=~"5.."}[5m]) 
          / rate(payment_service_http_requests_total[5m]) > 0.02
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx rate > 2%
          description: "HTTP 5xx error rate is {{ $value | humanizePercentage }} (threshold: 2%)"

  - name: backup_alerts
    interval: 60s
    rules:
      - alert: BackupFailure
        expr: |
          maysar_backup_success == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Database backup failed
          description: "The last scheduled backup did not complete successfully. Check backup logs and disk space."

      - alert: BackupDiskUsageHigh
        expr: |
          node_filesystem_avail_bytes{mountpoint="/backups"} / node_filesystem_size_bytes{mountpoint="/backups"} < 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backup disk usage above 80%
          description: "Backup storage volume is nearing capacity. Expand storage or adjust retention policy."

      - alert: RestoreVerificationStale
        expr: |
          maysar_restore_verification_success == 0
          or time() - maysar_restore_verification_last_success > 604800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: Restore verification has not succeeded in 7 days
          description: "Automated restore verification has not passed recently. Backups may not be restorable."
