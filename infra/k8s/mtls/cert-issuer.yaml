# Certificate Issuer for mTLS certificates
# Uses AWS Certificate Manager Private Certificate Authority

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: maysar-ca-issuer
spec:
  acme:
    # ACME issuer configuration would go here for Let's Encrypt
    # For production, we recommend using AWS Private CA
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@maysar.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
---
# Certificate for Istio ingress gateway
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: istio-ingress-tls
  namespace: istio-system
spec:
  secretName: istio-ingress-tls
  issuerRef:
    name: maysar-ca-issuer
    kind: ClusterIssuer
  dnsNames:
  - "*.maysar.com"
  - "api.maysar.com"
---
# Certificate for service-to-service mTLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: service-mtls-ca
  namespace: cert-manager
spec:
  secretName: service-mtls-ca
  isCA: true
  issuerRef:
    name: maysar-ca-issuer
    kind: ClusterIssuer
  dnsNames:
  - "maysar.local"
---
# Issuer for service certificates
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: service-ca-issuer
  namespace: default
spec:
  ca:
    secretName: service-mtls-ca
---
# Certificate template for services
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-gateway-tls
  namespace: default
spec:
  secretName: api-gateway-tls
  issuerRef:
    name: service-ca-issuer
    kind: Issuer
  dnsNames:
  - "api-gateway"
  - "api-gateway.default"
  - "api-gateway.default.svc"
  - "api-gateway.default.svc.cluster.local"
