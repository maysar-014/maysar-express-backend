# Istio installation for service mesh and mTLS
# This enables automatic mTLS between all services in the mesh

apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: istiocontrolplane
  namespace: istio-system
spec:
  profile: default
  components:
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            ports:
              - name: status-port
                port: 15021
                targetPort: 15021
              - name: http2
                port: 80
                targetPort: 8080
              - name: https
                port: 443
                targetPort: 8443
              - name: tls
                port: 15443
                targetPort: 15443
    pilot:
      enabled: true
      k8s:
        env:
          - name: PILOT_CERT_PROVIDER
            value: istiod
          - name: PILOT_TRACE_SAMPLING
            value: "100.0"
  values:
    global:
      proxy:
        accessLogFile: "/dev/stdout"
        accessLogEncoding: TEXT
      controlPlaneSecurityEnabled: true
      mtls:
        enabled: true
      pilotCertProvider: istiod
      jwtPolicy: third-party-jwt
    pilot:
      autoscaleEnabled: false
      replicaCount: 2
      traceSampling: 100.0
    gateways:
      istio-ingressgateway:
        autoscaleEnabled: false
        type: ClusterIP
    sidecarInjectorWebhook:
      enableNamespacesByDefault: true
    security:
      selfSigned: false
---
# PeerAuthentication policy for automatic mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# DestinationRule for load balancing and mTLS
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: default
  namespace: istio-system
spec:
  host: "*.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
# AuthorizationPolicy for service-to-service communication
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-mesh-communication
  namespace: istio-system
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/*/sa/*"]
    to:
    - operation:
        methods: ["*"]
