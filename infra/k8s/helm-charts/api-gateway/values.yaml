# Default values for api-gateway Helm chart

# API Gateway Configuration
replicaCount: 3

image:
  repository: maysar/api-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.maysar.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-gateway-tls
      hosts:
        - api.maysar.com

# Environment variables
env:
  NODE_ENV: production
  PORT: "3000"
  JWT_SECRET: ""
  DATABASE_URL: ""
  REDIS_URL: ""
  PESAPAL_CONSUMER_KEY: ""
  PESAPAL_CONSUMER_SECRET: ""

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ConfigMap for application configuration
configMap:
  LOG_LEVEL: info
  API_VERSION: v1
  HEALTH_CHECK_PATH: /health
  METRICS_PATH: /metrics

# Secrets
secrets:
  enabled: true
  name: api-gateway-secrets

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s

# Dependencies
ingress-nginx:
  enabled: true

cert-manager:
  enabled: true
  installCRDs: true
