apiVersion: v2
name: api-gateway
description: Maysar API Gateway Helm Chart
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: ingress-nginx
    version: "4.7.1"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress-nginx.enabled
  - name: cert-manager
    version: "v1.12.3"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled
