apiVersion: v1
kind: ConfigMap
metadata:
  name: maysar-backend-config
  namespace: maysar-backend
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  DATABASE_MAX_POOL: "20"
  REDIS_MAX_CONNECTIONS: "50"
  # Feature flags for 26 modules (enable all by default in monolith)
  ENABLE_USER_MODULE: "true"
  ENABLE_ORDER_MODULE: "true"
  ENABLE_PAYMENT_MODULE: "true"
  ENABLE_WALLET_MODULE: "true"
  # ... other flags
---
apiVersion: v1
kind: Secret
metadata:
  name: maysar-backend-secrets
  namespace: maysar-backend
type: Opaque
# WARNING: Plaintext secrets are for local development only
# Production: Use OCI Vault + ExternalSecrets or kubectl create secret at deploy time
# See docs/secrets-management.md for proper secret injection
stringData:
  DATABASE_URL: "REPLACE_WITH_SECRET_MANAGER_VALUE"
  REDIS_URL: "REPLACE_WITH_SECRET_MANAGER_VALUE"
  JWT_SECRET: "REPLACE_WITH_SECRET_MANAGER_VALUE"