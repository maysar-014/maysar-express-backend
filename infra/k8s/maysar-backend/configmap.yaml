apiVersion: v1
kind: ConfigMap
metadata:
  name: maysar-backend-config
  namespace: maysar-backend
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  DATABASE_MAX_POOL: "20"
  REDIS_MAX_CONNECTIONS: "50"
  # Feature flags for 26 modules (enable all by default in monolith)
  ENABLE_USER_MODULE: "true"
  ENABLE_ORDER_MODULE: "true"
  ENABLE_PAYMENT_MODULE: "true"
  ENABLE_WALLET_MODULE: "true"
  # ... other flags
---
apiVersion: v1
kind: Secret
metadata:
  name: maysar-backend-secrets
  namespace: maysar-backend
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@host:5432/db"
  REDIS_URL: "redis://host:6379"
  JWT_SECRET: "dacc72949afd8a56f190f9de190cb88b880c153df7104386270bf24334160bd8"