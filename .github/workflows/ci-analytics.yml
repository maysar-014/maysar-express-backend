name: Analytics Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'analytics-service/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'analytics-service/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: analytics_test_db
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'analytics-service/package-lock.json'

    - name: Install dependencies
      working-directory: ./analytics-service
      run: npm install

    - name: Generate Prisma blocks
      working-directory: ./analytics-service
      run: npx prisma generate

    - name: Run tests with coverage
      working-directory: ./analytics-service
      run: npm test -- --coverage
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/analytics_test_db?schema=public
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Check Domain Coverage
      working-directory: ./analytics-service
      run: |
        COVERAGE=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c['src/domain'].lines.pct)")
        if (( $(echo "$COVERAGE < 98" | bc -l) )); then
          echo "Domain coverage $COVERAGE% is below 98% gate"
          exit 1
        fi
