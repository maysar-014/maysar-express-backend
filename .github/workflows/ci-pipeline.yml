# Complete CI/CD Pipeline for Maysar E-commerce Platform
# GitHub Actions workflows for all 13 services with enterprise-grade automation

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      service:
        description: 'Specific service to deploy (leave empty for all)'
        required: false
        type: string

# TEMPORARILY DISABLED - Workflow incompatible with current monorepo structure
# Re-enable after restructuring services with individual package.json and Dockerfiles

jobs:
  disabled:
    name: Pipeline Disabled
    runs-on: ubuntu-latest
    steps:
    - name: Skip execution
      run: |
        echo "This workflow is temporarily disabled as it requires individual service package.json and Dockerfiles."
        echo "Current project uses a monorepo structure. Use ci.yml workflow instead."
        exit 0
