name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  preflight:
    name: Staging Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write staging env file
        run: printf '%s' "$ENV_FILE" > .env.staging
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Run staging preflight
        run: npm run staging:preflight

  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: preflight
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST secret is required}"
          SSH_PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync project files to staging host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST secret is required}"
          : "${SSH_USER:?SSH_USER secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
          SSH_PORT="${SSH_PORT:-22}"

          rsync -az \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "coverage/" \
            --exclude "reports/" \
            --exclude "logs/" \
            --exclude "uploads/" \
            --exclude ".env" \
            --exclude ".env.*" \
            -e "ssh -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Deploy staging stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST secret is required}"
          : "${SSH_USER:?SSH_USER secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
          : "${ENV_FILE:?ENV_FILE secret is required}"
          SSH_PORT="${SSH_PORT:-22}"

          ENV_FILE_B64="$(printf '%s' "$ENV_FILE" | base64 -w0)"

          ssh -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" \
            "set -euo pipefail;
             mkdir -p '$DEPLOY_PATH';
             printf '%s' '$ENV_FILE_B64' | base64 -d > '$DEPLOY_PATH/.env.staging';
             cd '$DEPLOY_PATH';
             bash scripts/deploy/remote-compose-deploy.sh staging"

      - name: Verify staging health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "No HEALTHCHECK_URL configured for staging environment. Skipping health check."
            exit 0
          fi
          curl --fail --silent --show-error --retry 20 --retry-delay 5 "$HEALTHCHECK_URL"
