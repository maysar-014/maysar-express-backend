name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - prod
  push:
    branches:
      - dev
      - staging
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: maysar_ci
          POSTGRES_USER: maysar_ci
          POSTGRES_PASSWORD: maysar_ci_password
        options: >-
          --health-cmd "pg_isready -U maysar_ci -d maysar_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        id: lint
        continue-on-error: ${{ github.ref == 'refs/heads/staging' }}
        run: npm run lint

      - name: Lint advisory for staging
        if: github.ref == 'refs/heads/staging' && steps.lint.outcome == 'failure'
        run: echo "::warning::Lint failed on staging but is temporarily non-blocking. Fix lint debt before promoting to prod."

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Build
        run: npm run build

      - name: Contract guards (field persistence + OpenAPI ratchet)
        # MUST stay a standalone step. These guards live in the `contract-scripts`
        # jest project, which is the LAST of 34 projects, and
        # `scripts/testing/run-jest-projects.js` exits on the first failing project.
        # So while `npm test` is red, `contract-scripts` is never reached and these
        # guards do not execute at all - which is exactly when a silent field drop
        # or an undocumented route is most likely to be introduced. Running them here
        # makes them unconditional and independent of unrelated unit failures.
        # BLG-001 / BLG-014 / BLG-021.
        run: npx jest --selectProjects contract-scripts --runInBand

      - name: OpenAPI contract ratchet (prevent breaking API changes)
        run: node scripts/contract/ratchet.js
      - name: Dependency vulnerability scan
        run: npm audit --production --audit-level=high


      - name: Unit and integration tests
        run: npm run test -- --runInBand --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://maysar_ci:maysar_ci_password@localhost:5432/maysar_ci
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: TEST_JWT_SECRET
          USER_SERVICE_JWT_SECRET: TEST_USER_SERVICE_JWT_SECRET
          AUTH_SERVICE_SESSION_SECRET: TEST_AUTH_SESSION_SECRET

  production-preflight:
    name: Production Preflight Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run preflight on prod branch pushes and manual dispatch
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Production Preflight Gate
        id: preflight
        continue-on-error: true
        run: |
          set -euo pipefail
          # Load production-like environment variables for preflight validation
          export NODE_ENV=production
          export PORT=3000
          export HOST=0.0.0.0
          export DATABASE_URL="${{ secrets.DATABASE_URL || 'postgresql://maysar_ci:maysar_ci_password@localhost:5432/maysar_ci' }}"
          export REDIS_URL="${{ secrets.REDIS_URL || 'redis://localhost:6379' }}"
          export JWT_SECRET="${{ secrets.JWT_SECRET || 'CI_TEST_JWT_SECRET_DO_NOT_USE_IN_PROD' }}"
          export JWT_EXPIRES_IN=7d
          export PAYMENT_GATEWAY_URL="${{ secrets.PAYMENT_GATEWAY_URL || 'https://ci.payment-gateway.example.com' }}"
          export MEILI_MASTER_KEY="${{ secrets.MEILI_MASTER_KEY || 'CI_TEST_MEILI_KEY_DO_NOT_USE_IN_PROD' }}"
          export LOG_LEVEL=info
          
          npx tsx scripts/production/preflight-env.ts
        env:
          ENV_FILE: .env.production

      - name: Fail on preflight failure
        if: steps.preflight.outcome == 'failure'
        run: |
          echo "::error::Production preflight gate failed. DO NOT DEPLOY TO PRODUCTION."
          echo "::error::Resolve all critical findings in ENGINEERING_REMEDIATION_PLAN.md before deploying."
          exit 1

      - name: Upload preflight results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-preflight-results
          path: |
            *.log
          retention-days: 30


  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate OpenAPI files
        run: |
          set -euo pipefail
          npm ci
          if [ -f openapi.yaml ]; then
            npx --yes @redocly/cli@latest lint openapi.yaml
          fi
          if [ -f api-contract.yaml ]; then
            npx --yes @redocly/cli@latest lint api-contract.yaml
          fi

  schemathesis:
    # Renamed from contract-tests: this job runs Schemathesis against a live
    # stack, NOT the jest contract-scripts project. The old name implied the
    # field-persistence guard ran here; it does not. Those guards run in the
    # unconditional quality-gates job (see the Contract guards step).
    name: Schemathesis API examples (dev branch)
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - openapi-validation
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Start contract test stack
        run: docker compose -f docker/docker-compose.test.yml up -d --build

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become ready in time"
          exit 1

      - name: Run contract examples
        run: npm run test:contract:examples
        env:
          CONTRACT_TEST_AUTO_INSTALL: "1"

      - name: Upload contract test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-reports
          path: tests/contract/reports/
          retention-days: 14

      - name: Stop contract test stack
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down
