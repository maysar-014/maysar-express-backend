name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - prod
  push:
    branches:
      - dev
      - staging
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: maysar_ci
          POSTGRES_USER: maysar_ci
          POSTGRES_PASSWORD: maysar_ci_password
        options: >-
          --health-cmd "pg_isready -U maysar_ci -d maysar_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        id: lint
        continue-on-error: ${{ github.ref == 'refs/heads/staging' }}
        run: npm run lint

      - name: Lint advisory for staging
        if: github.ref == 'refs/heads/staging' && steps.lint.outcome == 'failure'
        run: echo "::warning::Lint failed on staging but is temporarily non-blocking. Fix lint debt before promoting to prod."

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm run test -- --runInBand --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://maysar_ci:maysar_ci_password@localhost:5432/maysar_ci
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: TEST_JWT_SECRET
          USER_SERVICE_JWT_SECRET: TEST_USER_SERVICE_JWT_SECRET
          AUTH_SERVICE_SESSION_SECRET: TEST_AUTH_SESSION_SECRET

  governance-audit:
    name: Governance Audit
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - openapi-validation
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Start test stack
        run: docker compose -f docker/docker-compose.test.yml up -d --build

      - name: Wait for test stack readiness
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/health >/dev/null && curl -fsS http://localhost:3000/ready >/dev/null; then
              echo "Governance target stack is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Target stack did not become ready in time"
          exit 1

      - name: Run governance audit
        run: npm run governance:audit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://maysar:maysar@localhost:5433/maysar_test?schema=public
          REDIS_URL: redis://:maysar@localhost:6380
          GOVERNANCE_TARGET_BASE_URL: http://localhost:3000
          GOVERNANCE_SERVICE_READINESS_TARGETS_JSON: '[{"name":"platform-health","url":"http://localhost:3000/health","expectedStatus":200},{"name":"platform-ready","url":"http://localhost:3000/ready","expectedStatus":200}]'

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-audit-reports
          path: reports/governance/
          retention-days: 14

      - name: Stop test stack
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down

  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate OpenAPI files
        run: |
          set -euo pipefail
          npm ci
          if [ -f openapi.yaml ]; then
            npx --yes @redocly/cli@latest lint openapi.yaml
          fi
          if [ -f api-contract.yaml ]; then
            npx --yes @redocly/cli@latest lint api-contract.yaml
          fi

  contract-tests:
    name: Contract Tests (dev branch)
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - openapi-validation
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Start contract test stack
        run: docker compose -f docker/docker-compose.test.yml up -d --build

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become ready in time"
          exit 1

      - name: Run contract examples
        run: npm run test:contract:examples
        env:
          CONTRACT_TEST_AUTO_INSTALL: "1"

      - name: Upload contract test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-reports
          path: tests/contract/reports/
          retention-days: 14

      - name: Stop contract test stack
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down
