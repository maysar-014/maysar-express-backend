openapi: 3.0.3
info:
  title: Logistics Service API Contract
  version: 1.0.0
  description: |
    Comprehensive REST API contract for the Maysar Logistics Service.
    This service provides delivery management, route optimization, real-time tracking,
    performance analytics, and earnings calculation for courier operations.

    **🏛️ Architecture Constitution Compliant**
    This service implements the Architecture Constitution with strict layer isolation,
    comprehensive testing, and automated quality gates.

    **Key Features:**
    - Delivery cost calculation and management
    - Route optimization with constraints
    - Real-time courier tracking with Saga orchestration
    - Performance analytics and KPIs with circuit breakers
    - Earnings calculation and commission management
    - Clean Architecture with layer isolation validation
    - Automated constitution compliance testing
    - Real-time architectural fitness monitoring
    - Enhanced security and performance benchmarking

  contact:
    name: Maysar Development Team
    email: api@maysar.com
    url: https://maysar.com/api-docs

  license:
    name: Proprietary
    url: https://maysar.com/license

servers:
  - url: http://localhost:3007
    description: Local development server
  - url: https://api-staging.maysar.com/logistics
    description: Staging server
  - url: https://api.maysar.com/logistics
    description: Production server

security:
  - bearerAuth: []

paths:

  # ==================== HEALTH & STATUS ENDPOINTS ====================

  /health:
    get:
      tags:
        - Health
      summary: Service health check
      description: |
        Comprehensive health check endpoint that verifies service status,
        database connectivity, and all engine health.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ready:
    get:
      tags:
        - Health
      summary: Service readiness check
      description: |
        Readiness check that verifies database and external service connectivity.
        Used by load balancers and orchestration systems.
      operationId: getReadiness
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/stats/performance:
    get:
      tags:
        - Monitoring
      summary: Performance statistics
      description: |
        Real-time performance metrics including memory usage, uptime,
        and system resource statistics.
      operationId: getPerformanceStats
      responses:
        '200':
          description: Performance statistics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceStatsResponse'

  # ==================== DELIVERY ENDPOINTS ====================

  /api/v1/deliveries/calculate:
    post:
      tags:
        - Deliveries
      summary: Calculate delivery cost
      description: |
        Calculate shipping cost and delivery time based on package details,
        pickup/delivery addresses, and service requirements.
      operationId: calculateDeliveryCost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCalculationRequest'
      responses:
        '200':
          description: Delivery cost calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCalculationResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Calculation engine error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/deliveries:
    get:
      tags:
        - Deliveries
      summary: List deliveries
      description: Retrieve paginated list of deliveries with filtering options.
      operationId: listDeliveries
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_transit, delivered, cancelled]
          description: Filter by delivery status
      responses:
        '200':
          description: Deliveries retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'

  /api/v1/deliveries/{deliveryId}:
    get:
      tags:
        - Deliveries
      summary: Get delivery details
      description: Retrieve detailed information about a specific delivery.
      operationId: getDeliveryDetails
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
          description: Unique delivery identifier
      responses:
        '200':
          description: Delivery details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetailsResponse'
        '404':
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/deliveries/{deliveryId}/history:
    get:
      tags:
        - Deliveries
      summary: Get delivery history
      description: Retrieve complete history and status changes for a delivery.
      operationId: getDeliveryHistory
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
          description: Unique delivery identifier
      responses:
        '200':
          description: Delivery history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryHistoryResponse'
        '404':
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== ROUTE ENDPOINTS ====================

  /api/v1/routes:
    get:
      tags:
        - Routes
      summary: List routes
      description: Retrieve paginated list of delivery routes.
      operationId: listRoutes
      responses:
        '200':
          description: Routes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponse'

    post:
      tags:
        - Routes
      summary: Create route
      description: Create a new delivery route with stops and constraints.
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreateRequest'
      responses:
        '201':
          description: Route created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteCreateResponse'
        '400':
          description: Invalid route data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/routes/optimize:
    post:
      tags:
        - Routes
      summary: Optimize route
      description: |
        Calculate optimal delivery route using advanced algorithms
        considering distance, time, traffic, and delivery constraints.
      operationId: optimizeRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteOptimizationRequest'
      responses:
        '200':
          description: Route optimized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteOptimizationResponse'
        '400':
          description: Invalid optimization parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Optimization engine error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/routes/{routeId}:
    get:
      tags:
        - Routes
      summary: Get route details
      description: Retrieve detailed information about a specific route.
      operationId: getRouteDetails
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
          description: Unique route identifier
      responses:
        '200':
          description: Route details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetailsResponse'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/routes/courier/{courierId}:
    get:
      tags:
        - Routes
      summary: Get courier routes
      description: Retrieve all active routes assigned to a specific courier.
      operationId: getCourierRoutes
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
          description: Unique courier identifier
      responses:
        '200':
          description: Courier routes retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierRoutesResponse'
        '404':
          description: Courier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== COURIER ENDPOINTS ====================

  /api/v1/couriers:
    get:
      tags:
        - Couriers
      summary: List couriers
      description: Retrieve paginated list of all couriers with their status and details.
      operationId: listCouriers
      responses:
        '200':
          description: Couriers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierListResponse'

  /api/v1/couriers/{courierId}:
    get:
      tags:
        - Couriers
      summary: Get courier details
      description: Retrieve detailed information about a specific courier including stats and performance.
      operationId: getCourierDetails
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
          description: Unique courier identifier
      responses:
        '200':
          description: Courier details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierDetailsResponse'
        '404':
          description: Courier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Couriers
      summary: Update courier status
      description: Update the operational status of a courier (active, busy, offline).
      operationId: updateCourierStatus
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
          description: Unique courier identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierStatusUpdateRequest'
      responses:
        '200':
          description: Courier status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierStatusUpdateResponse'
        '404':
          description: Courier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== TRACKING ENDPOINTS ====================

  /api/v1/tracking/{trackingNumber}:
    get:
      tags:
        - Tracking
      summary: Get tracking information
      description: Retrieve current status and location for a tracked delivery.
      operationId: getTrackingInfo
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
          description: Package tracking number
      responses:
        '200':
          description: Tracking information retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingInfoResponse'
        '404':
          description: Tracking number not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tracking/location:
    post:
      tags:
        - Tracking
      summary: Update courier location
      description: |
        Update real-time location data for a courier. Used by mobile apps
        to send GPS coordinates, speed, and heading information.
      operationId: updateCourierLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdateRequest'
      responses:
        '200':
          description: Location updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationUpdateResponse'
        '400':
          description: Invalid location data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tracking/courier/{courierId}/history:
    get:
      tags:
        - Tracking
      summary: Get courier location history
      description: Retrieve historical location data for a courier over a specified period.
      operationId: getCourierLocationHistory
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
          description: Unique courier identifier
        - name: period
          in: query
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
          description: Time period for location history
      responses:
        '200':
          description: Location history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationHistoryResponse'
        '404':
          description: Courier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== ANALYTICS ENDPOINTS ====================

  /api/v1/analytics:
    get:
      tags:
        - Analytics
      summary: Get analytics overview
      description: Retrieve high-level analytics and KPIs for the logistics service.
      operationId: getAnalyticsOverview
      responses:
        '200':
          description: Analytics overview retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverviewResponse'

  /api/v1/analytics/performance:
    get:
      tags:
        - Analytics
      summary: Get performance report
      description: Generate detailed performance analytics report for a specific courier.
      operationId: getPerformanceReport
      parameters:
        - name: courierId
          in: query
          schema:
            type: string
          description: Optional courier ID to filter report
      responses:
        '200':
          description: Performance report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReportResponse'

  /api/v1/analytics/courier/{courierId}:
    get:
      tags:
        - Analytics
      summary: Get courier analytics
      description: Retrieve detailed analytics and KPIs for a specific courier.
      operationId: getCourierAnalytics
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
          description: Unique courier identifier
      responses:
        '200':
          description: Courier analytics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierAnalyticsResponse'
        '404':
          description: Courier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== EARNINGS ENDPOINTS ====================

  /api/v1/earnings:
    get:
      tags:
        - Earnings
      summary: Get earnings summary
      description: Retrieve overall earnings summary across all couriers and deliveries.
      operationId: getEarningsSummary
      responses:
        '200':
          description: Earnings summary retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarningsSummaryResponse'

    post:
      tags:
        - Earnings
      summary: Record earning
      description: Record a new earning entry for a courier delivery.
      operationId: recordEarning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EarningRecordRequest'
      responses:
        '201':
          description: Earning recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarningRecordResponse'
        '400':
          description: Invalid earning data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/earnings/courier/{courierId}:
    get:
      tags:
        - Earnings
      summary: Get courier earnings
      description: Retrieve earnings data for a specific courier.
      operationId: getCourierEarnings
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
          description: Unique courier identifier
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month, year]
            default: today
          description: Time period for earnings data
      responses:
        '200':
          description: Courier earnings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierEarningsResponse'
        '404':
          description: Courier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/earnings/calculate:
    post:
      tags:
        - Earnings
      summary: Calculate commissions
      description: |
        Calculate commission fees for multiple deliveries based on
        distance, time, and service type.
      operationId: calculateCommissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionCalculationRequest'
      responses:
        '200':
          description: Commissions calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionCalculationResponse'
        '400':
          description: Invalid delivery data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/earnings/summary:
    get:
      tags:
        - Earnings
      summary: Get earnings summary report
      description: Generate detailed earnings summary report for a specified period.
      operationId: getEarningsSummaryReport
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, year]
            default: month
          description: Reporting period
      responses:
        '200':
          description: Earnings summary report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarningsSummaryReportResponse'

  # ==================== ENGINE STATUS ENDPOINTS ====================

  /api/v1/engines/status:
    get:
      tags:
        - System
      summary: Get engine status
      description: |
        Retrieve health status of all logistics service engines.
        Includes 11 specialized engines for different operations.
      operationId: getEngineStatus
      responses:
        '200':
          description: Engine status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineStatusResponse'

  # ==================== ARCHITECTURAL ENDPOINTS ====================

  /api/v1/architecture/status:
    get:
      tags:
        - Architecture
      summary: Get architectural compliance status
      description: |
        Real-time architectural fitness monitoring with layer isolation validation,
        dependency direction checks, and constitution compliance metrics.
      operationId: getArchitectureStatus
      responses:
        '200':
          description: Architectural status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureStatusResponse'

  /api/v1/architecture/layers:
    get:
      tags:
        - Architecture
      summary: Get layer isolation metrics
      description: |
        Detailed metrics on layer separation, dependency validation,
        and architectural boundary enforcement.
      operationId: getLayerIsolationMetrics
      responses:
        '200':
          description: Layer isolation metrics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerIsolationResponse'

  /api/v1/architecture/test-results:
    get:
      tags:
        - Architecture
      summary: Get constitution compliance test results
      description: |
        Comprehensive test results for all architectural validation tests,
        including domain purity, dependency direction, and layer isolation.
      operationId: getConstitutionTestResults
      responses:
        '200':
          description: Constitution compliance test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstitutionTestResultsResponse'

  /api/v1/circuit-breaker/status:
    get:
      tags:
        - Reliability
      summary: Get circuit breaker status
      description: |
        Real-time status of all circuit breakers protecting external service calls,
        including database, cache, and third-party API connections.
      operationId: getCircuitBreakerStatus
      responses:
        '200':
          description: Circuit breaker status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitBreakerStatusResponse'

  /api/v1/performance/benchmarks:
    get:
      tags:
        - Performance
      summary: Get performance benchmarks
      description: |
        Real-time performance metrics and benchmarks for all engines and operations,
        including latency tracking, throughput analysis, and resource utilization.
      operationId: getPerformanceBenchmarks
      responses:
        '200':
          description: Performance benchmarks retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceBenchmarksResponse'

  /api/v1/security/audit:
    get:
      tags:
        - Security
      summary: Get security audit status
      description: |
        Comprehensive security audit results including vulnerability scanning,
        access control validation, and data protection compliance.
      operationId: getSecurityAuditStatus
      responses:
        '200':
          description: Security audit status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAuditResponse'

  # ==================== TEST ENDPOINTS ====================

  /api/v1/test/all-engines:
    get:
      tags:
        - Testing
      summary: Test all engines
      description: |
        Comprehensive test endpoint that validates all 11 engines
        are functioning correctly. Used for CI/CD and health monitoring.
      operationId: testAllEngines
      responses:
        '200':
          description: All engines tested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineTestResponse'
        '500':
          description: One or more engines failed testing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/test/architectural:
    get:
      tags:
        - Testing
      summary: Run architectural validation tests
      description: |
        Execute all architectural fitness functions and layer isolation tests
        to validate constitution compliance and design integrity.
      operationId: runArchitecturalTests
      responses:
        '200':
          description: Architectural tests completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitecturalTestResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication

  schemas:

    # ==================== COMMON SCHEMAS ====================

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Resource not found
            details:
              type: object
              additionalProperties: true

    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    # ==================== HEALTH SCHEMAS ====================

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                service:
                  type: string
                  example: logistics-service
                version:
                  type: string
                  example: "1.0.0"
                timestamp:
                  type: string
                  format: date-time
                uptime:
                  type: number
                  format: float
                  example: 3600.5
                engines:
                  type: array
                  items:
                    type: string
                  example: ["logistics", "route-optimization", "real-time-tracking"]
                engineDetails:
                  type: array
                  items:
                    $ref: '#/components/schemas/EngineInfo'
                dependencies:
                  $ref: '#/components/schemas/DependencyStatus'

    ReadinessResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          example: ready
        timestamp:
          type: string
          format: date-time

    EngineInfo:
      type: object
      required:
        - name
        - status
        - version
      properties:
        name:
          type: string
          example: logistics
        status:
          type: string
          enum: [healthy, unhealthy]
          example: healthy
        version:
          type: string
          example: "1.0.0"

    DependencyStatus:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/ServiceStatus'
        redis:
          $ref: '#/components/schemas/ServiceStatus'

    ServiceStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: healthy
        latency:
          type: number
          format: float
          example: 45.2
        lastChecked:
          type: string
          format: date-time

    PerformanceStatsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                service:
                  type: string
                  example: logistics-service
                uptime:
                  type: number
                  format: float
                  example: 3600.5
                memory:
                  $ref: '#/components/schemas/MemoryStats'
                timestamp:
                  type: string
                  format: date-time

    MemoryStats:
      type: object
      properties:
        rss:
          type: integer
          format: int64
          example: 9637888
        heapTotal:
          type: integer
          format: int64
          example: 244588544
        heapUsed:
          type: integer
          format: int64
          example: 235808592
