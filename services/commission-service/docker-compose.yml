version: '3.8'

services:
  commission-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@commission-db:5432/maysar_commission?schema=public
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - commission-db

  commission-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=maysar_commission
    ports:
      - "5432:5432"
    volumes:
      - commission-db-data:/var/lib/postgresql/data

volumes:
  commission-db-data:
