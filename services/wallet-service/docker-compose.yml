version: '3.8'

services:
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@wallet-db:5432/maysar_wallet?schema=public
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - wallet-db

  wallet-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=maysar_wallet
    ports:
      - "5434:5432"
    volumes:
      - wallet-db-data:/var/lib/postgresql/data

volumes:
  wallet-db-data:
