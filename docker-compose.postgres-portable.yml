services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maysar}
      POSTGRES_USER: ${POSTGRES_USER:-maysar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-/data/postgres}
        target: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-maysar} -d ${POSTGRES_DB:-maysar}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s

  postgres-backup:
    image: postgres:15-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-maysar}
      POSTGRES_USER: ${POSTGRES_USER:-maysar}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DIR: /backups/postgres
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-30}
      BACKUP_FILE_PREFIX: ${POSTGRES_BACKUP_FILE_PREFIX:-maysar}
      BACKUP_CRON: ${POSTGRES_BACKUP_CRON:-0 2 * * *}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ${POSTGRES_BACKUP_DIR:-/backups/postgres}
        target: /backups/postgres
      - ./scripts/backup/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
      - ./scripts/backup/postgres-restore.sh:/usr/local/bin/postgres-restore.sh:ro
      - ./scripts/backup/postgres-restore-verify.sh:/usr/local/bin/postgres-restore-verify.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups/postgres
        printf '%s %s\n' "$$BACKUP_CRON" "/bin/sh /usr/local/bin/postgres-backup.sh >> /var/log/postgres-backup.log 2>&1" > /etc/crontabs/root
        /bin/sh /usr/local/bin/postgres-backup.sh
        exec crond -f -l 8
