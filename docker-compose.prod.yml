version: '3.8'

services:
  maysar-backend:
    build: .
    image: maysar-dtn:latest
    restart: unless-stopped
    environment:
      # See .env.example for required configuration
      DATABASE_URL: postgresql://${MAYSAR_APP_USER:maysar_app}:${MAYSAR_APP_PASSWORD:change-me}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      METRICS_ENABLED: "true"
      JAEGER_ENDPOINT: "http://jaeger:14268/api/traces"
      SERVICE_NAME: "maysar-monolith"
      SERVICE_VERSION: "1.0.0"
      MAYSAR_APP_USER: ${MAYSAR_APP_USER:-maysar_app}
      MAYSAR_APP_PASSWORD: ${MAYSAR_APP_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    ports:
      - "3000:3000"
    # No volume mounts or dev dependencies in production
    networks:
      - maysar-network
    # Note: deploy.replicas: 2 requires a load balancer (e.g., Nginx or Traefik) in front.
    # Refer to docs/scaling-strategy.md for more details.
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maysar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal_archive
      - ./config/pgbackrest.conf:/etc/pgbackrest.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-maysar}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed to host in production-like setup
    networks:
      - maysar-network
    command: >
      postgres
      -c shared_buffers=512MB
      -c max_connections=200
      -c work_mem=4MB
      -c archive_mode=on
      -c archive_command='cp %p /var/lib/postgresql/wal_archive/%f'
      -c archive_timeout=60
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    # No ports exposed to host in production-like setup
    networks:
      - maysar-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    networks:
      - maysar-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - maysar-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - maysar-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  postgres-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maysar-network
    volumes:
      - ./scripts/backup/postgres-backup.sh:/backup.sh:ro
      - ./scripts/backup/postgres-restore-verify.sh:/backup-verify.sh:ro
      - ./scripts/backup/postgres-restore-pitr.sh:/backup-pitr.sh:ro
      - postgres_backups:/backups
      - pgbackrest_repo:/var/lib/pgbackrest:rw
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-maysar}
      POSTGRES_USER: ${MAYSAR_BACKUP_USER:-maysar_backup}
      PGPASSWORD: ${MAYSAR_BACKUP_PASSWORD:-change-me}
      BACKUP_DIR: /backups/postgres
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-7}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      PG_BACKREST_STANZA: maysar
      PG_BACKREST_CONFIG: /etc/pgbackrest.conf
    entrypoint: >
      sh -c "apk add --no-cache s3cmd age openssl pgbackrest &&
             mkdir -p /var/lib/pgbackrest /var/log/pgbackrest &&
             chmod 750 /var/lib/pgbackrest /var/log/pgbackrest &&
             chmod +x /backup.sh /backup-verify.sh /backup-pitr.sh &&
             echo '0 * * * * /backup.sh >> /var/log/postgres-backup.log 2>&1' | crontab - &&
             echo '0 3 * * 0 /backup-verify.sh >> /var/log/postgres-verify.log 2>&1' | crontab - &&
             crond -f -l 2"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  redis-backup:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - maysar-network
    volumes:
      - ./scripts/backup/redis-backup.sh:/backup.sh:ro
      - redis_data:/data:ro
      - redis_backups:/backups
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      BACKUP_DIR: /backups/redis
      BACKUP_RETENTION_DAYS: ${REDIS_BACKUP_RETENTION_DAYS:-7}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    entrypoint: >
      sh -c "apk add --no-cache s3cmd age openssl &&
             chmod +x /backup.sh &&
             echo '0 * * * * /backup.sh >> /var/log/redis-backup.log 2>&1' | crontab - &&
             crond -f -l 2"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  meili_data:
  postgres_backups:
  redis_backups:
  wal_archive:
  pgbackrest_repo:


networks:
  maysar-network:
    driver: bridge
