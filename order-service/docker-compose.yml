version: '3.8'

# ==========================================
# Order Service - Local Development Stack
# Complete development environment with all dependencies
# ==========================================

services:
  # ================================
  # Order Service Application
  # ================================
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: order-service-dev
    restart: unless-stopped

    # Development configuration
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://order_user:order_password@postgres:5432/order_service_dev?schema=public
      - SUPABASE_URL=http://supabase:8000
      - SUPABASE_KEY=dev-anon-key
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=dev-jwt-secret-for-development-only
      - LOG_LEVEL=debug
      - ENABLE_METRICS=true
      - METRICS_PORT=9090

    ports:
      - "3002:3002"      # Application port
      - "9090:9090"      # Metrics port
      - "9229:9229"      # Debug port

    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      # Mount logs and reports
      - ./logs:/app/logs
      - ./reports:/app/reports
      # Mount test coverage
      - ./coverage:/app/coverage

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      supabase:
        condition: service_started

    networks:
      - order-service-network

    # Development commands
    command: >
      sh -c "
        echo 'Waiting for dependencies...' &&
        sleep 10 &&
        echo 'Running database migrations...' &&
        npm run db:push &&
        echo 'Starting development server...' &&
        npm run dev
      "

    # Health check for development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ================================
  # PostgreSQL Database
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: order-service-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_DB=order_service_dev
      - POSTGRES_USER=order_user
      - POSTGRES_PASSWORD=order_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    networks:
      - order-service-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_service_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # Redis Cache
  # ================================
  redis:
    image: redis:7-alpine
    container_name: order-service-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro

    command: redis-server /etc/redis/redis.conf

    networks:
      - order-service-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ================================
  # Supabase (Local Development)
  # ================================
  supabase:
    image: supabase/postgres:15.1.0.147
    container_name: order-service-supabase
    restart: unless-stopped

    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long

    ports:
      - "8000:8000"  # Supabase API
      - "54321:5432" # PostgreSQL

    volumes:
      - supabase_data:/var/lib/postgresql/data

    networks:
      - order-service-network

  # ================================
  # pgAdmin (Database Management)
  # ================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: order-service-pgadmin
    restart: unless-stopped

    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@maysar.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False

    ports:
      - "8080:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

    networks:
      - order-service-network

  # ================================
  # Redis Commander (Cache Management)
  # ================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: order-service-redis-commander
    restart: unless-stopped

    environment:
      - REDIS_HOSTS=local:redis:6379

    ports:
      - "8081:8081"

    depends_on:
      - redis

    networks:
      - order-service-network

  # ================================
  # Prometheus (Metrics Collection)
  # ================================
  prometheus:
    image: prom/prometheus:latest
    container_name: order-service-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

    networks:
      - order-service-network

  # ================================
  # Grafana (Metrics Visualization)
  # ================================
  grafana:
    image: grafana/grafana:latest
    container_name: order-service-grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    networks:
      - order-service-network

# ================================
# Volumes
# ================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  supabase_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ================================
# Networks
# ================================
networks:
  order-service-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ================================
# Development Commands
# ================================

# Use this to start the full development stack
# docker-compose up -d

# View logs
# docker-compose logs -f order-service

# Run tests
# docker-compose exec order-service npm test

# Access database
# docker-compose exec postgres psql -U order_user -d order_service_dev

# Access Redis
# docker-compose exec redis redis-cli

# Stop and remove everything
# docker-compose down -v
