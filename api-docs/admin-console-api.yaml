openapi: 3.0.3
info:
  title: Maysar Admin Console API
  description: Complete API specification for Admin Console operations
  version: 1.0.0
  contact:
    name: Maysar Platform Team
    email: admin@maysar.com
servers:
  - url: https://api.maysar.com/v1
    description: Production server
  - url: https://staging-api.maysar.com/v1
    description: Staging server
  - url: http://localhost:3000/v1
    description: Development server

security:
  - BearerAuth: []

paths:
  # Dashboard APIs
  /admin/dashboard/metrics:
    get:
      tags: [Dashboard]
      summary: Get admin dashboard metrics
      description: Retrieve real-time system metrics and KPIs
      responses:
        '200':
          description: Dashboard metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'

  # User Management APIs
  /admin/users:
    get:
      tags: [User Management]
      summary: List platform users
      description: Get paginated list of users with filtering options
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, SELLER, COURIER, SUPPLIER, ENABLER, CUSTOMER]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, SUSPENDED, DEACTIVATED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags: [User Management]
      summary: Create new user account
      description: Create a new user account with specified role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /admin/users/{userId}/role:
    put:
      tags: [User Management]
      summary: Update user role
      description: Update the role of an existing user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: User role updated successfully

  /admin/users/{userId}/suspend:
    put:
      tags: [User Management]
      summary: Suspend user account
      description: Suspend a user account with reason
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
      responses:
        '200':
          description: User suspended successfully

  # KYC Management APIs
  /admin/kyc/queue:
    get:
      tags: [KYC Management]
      summary: Get KYC verification queue
      description: Retrieve pending KYC verifications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, IN_REVIEW, APPROVED, REJECTED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: KYC queue retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCQueueResponse'

  /admin/kyc/{kycId}/approve:
    put:
      tags: [KYC Management]
      summary: Approve/reject KYC
      description: Approve or reject KYC verification
      parameters:
        - name: kycId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KYCDecisionRequest'
      responses:
        '200':
          description: KYC decision processed successfully

  # Transaction Monitoring APIs
  /admin/transactions:
    get:
      tags: [Finance]
      summary: Monitor transactions
      description: Get list of transactions with filtering and monitoring
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, COMPLETED, FAILED, FLAGGED, BLOCKED]
        - name: flagged
          in: query
          schema:
            type: boolean
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'

  /admin/transactions/{transactionId}/flag:
    post:
      tags: [Finance]
      summary: Flag suspicious transaction
      description: Flag a transaction as suspicious for review
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagTransactionRequest'
      responses:
        '200':
          description: Transaction flagged successfully

  # Dispute Management APIs
  /admin/disputes:
    get:
      tags: [Finance]
      summary: List disputes
      description: Get list of disputes for resolution
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, RESOLVED, ESCALATED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Disputes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeListResponse'
    post:
      tags: [Finance]
      summary: Create dispute case
      description: Create a new dispute case for resolution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeRequest'
      responses:
        '201':
          description: Dispute created successfully

  # System Health APIs
  /admin/system/health:
    get:
      tags: [System]
      summary: Get system health metrics
      description: Retrieve system health and performance metrics
      responses:
        '200':
          description: System health retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'

  # Compliance APIs
  /admin/compliance/reports:
    get:
      tags: [Compliance]
      summary: Generate compliance reports
      description: Generate and retrieve compliance reports
      parameters:
        - name: reportType
          in: query
          schema:
            type: string
            enum: [GDPR, KYC, TRANSACTION_MONITORING, AUDIT_TRAIL]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Compliance report generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReportResponse'

  # Audit Logs APIs
  /admin/audit-logs:
    get:
      tags: [Audit]
      summary: Get audit logs
      description: Retrieve system audit logs with filtering
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DashboardMetrics:
      type: object
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        totalTransactions:
          type: integer
        totalRevenue:
          type: number
        systemHealth:
          type: string
          enum: [HEALTHY, WARNING, CRITICAL]
        pendingKYC:
          type: integer
        flaggedTransactions:
          type: integer

    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, SELLER, COURIER, SUPPLIER, ENABLER, CUSTOMER]
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, DEACTIVATED]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, SELLER, COURIER, SUPPLIER, ENABLER, CUSTOMER]
        profile:
          type: object

    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, SELLER, COURIER, SUPPLIER, ENABLER, CUSTOMER]

    SuspendUserRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        duration:
          type: integer

    KYCQueueResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/KYCDocument'

    KYCDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        documentType:
          type: string
        status:
          type: string
          enum: [PENDING, IN_REVIEW, APPROVED, REJECTED]
        submittedAt:
          type: string
          format: date-time

    KYCDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reason:
          type: string

    TransactionListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
        flagged:
          type: boolean
        createdAt:
          type: string
          format: date-time

    FlagTransactionRequest:
      type: object
      required: [flagType, reason]
      properties:
        flagType:
          type: string
          enum: [FRAUD, COMPLIANCE, MANUAL_REVIEW]
        reason:
          type: string

    DisputeListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dispute'

    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateDisputeRequest:
      type: object
      required: [orderId, reason]
      properties:
        orderId:
          type: string
          format: uuid
        reason:
          type: string
        description:
          type: string

    SystemHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [HEALTHY, WARNING, CRITICAL]
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              responseTime:
                type: number

    ComplianceReportResponse:
      type: object
      properties:
        reportType:
          type: string
        generatedAt:
          type: string
          format: date-time
        data:
          type: object

    AuditLogResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        timestamp:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object