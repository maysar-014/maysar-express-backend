version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: maysar_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maysar_dev}
      POSTGRES_USER: ${POSTGRES_USER:-maysar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Ports removed for security - only accessible within Docker network
    # Uncomment for local development: ports: - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maysar_user} -d ${POSTGRES_DB:-maysar_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maysar_network

  redis:
    image: redis:7-alpine
    container_name: maysar_redis
    # Ports removed for security - only accessible within Docker network
    # Uncomment for local development: ports: - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - maysar_network

networks:
  maysar_network:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
