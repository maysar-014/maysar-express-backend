x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: ${PORT:-3000}
  HOST: ${HOST:-0.0.0.0}
  DATABASE_URL: "postgresql://${POSTGRES_USER:-maysar}:${POSTGRES_PASSWORD:-maysar}@postgres:5432/${POSTGRES_DB:-maysar}?schema=public"
  REDIS_URL: "redis://:${REDIS_PASSWORD:-maysar}@redis:6379"
  POSTGRES_USER: ${POSTGRES_USER:-maysar}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maysar}
  POSTGRES_DB: ${POSTGRES_DB:-maysar}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-maysar}
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-keep-this-string-long-enough}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  BASE_URL: ${BASE_URL:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3500}
  SERVICE_NAME: ${SERVICE_NAME:-maysar-backend}
  SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
  ALLOWED_SERVICE_KEYS: ${ALLOWED_SERVICE_KEYS:-dev-service-key}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3100,http://localhost:3200}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-meilisearch}
  MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
  MEILISEARCH_PORT: ${MEILISEARCH_PORT:-7700}
  MEILISEARCH_PROTOCOL: ${MEILISEARCH_PROTOCOL:-http}
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
  MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-dev-master-key}
  MEILISEARCH_INDEX_NAME: ${MEILISEARCH_INDEX_NAME:-catalog}
  MEILISEARCH_REQUEST_TIMEOUT: ${MEILISEARCH_REQUEST_TIMEOUT:-30000}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-dev}
  SMTP_PASS: ${SMTP_PASS:-dev}
  SMTP_FROM: ${SMTP_FROM:-no-reply@maysar.local}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Maysar Local}
  AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
  AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-dev-africastalking-key}
  AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-MAYSAR}
  AFRICASTALKING_ENV: ${AFRICASTALKING_ENV:-sandbox}
  AFRICASTALKING_BASE_URL: ${AFRICASTALKING_BASE_URL:-https://api.sandbox.africastalking.com/version1}
  SMS_PROVIDER: ${SMS_PROVIDER:-africastalking}
  SMS_SERVICE_PROVIDER: ${SMS_SERVICE_PROVIDER:-africastalking}
  SMS_ALLOW_LIVE_IN_DEV: ${SMS_ALLOW_LIVE_IN_DEV:-false}
  PAYMENT_GATEWAY_CONSUMER_KEY: ${PAYMENT_GATEWAY_CONSUMER_KEY:-dev-paymentGateway-consumer-key}
  PAYMENT_GATEWAY_CONSUMER_SECRET: ${PAYMENT_GATEWAY_CONSUMER_SECRET:-dev-paymentGateway-consumer-secret}
  PAYMENT_GATEWAY_SECRET_KEY: ${PAYMENT_GATEWAY_SECRET_KEY:-dev-paymentGateway-secret-key}
  PAYMENT_GATEWAY_IPN_ID: ${PAYMENT_GATEWAY_IPN_ID:-dev-ipn-id}
  PAYMENT_GATEWAY_URL: ${PAYMENT_GATEWAY_URL:-https://cybqa.paymentGateway.com/paymentGatewayv3}
  PAYMENT_GATEWAY_WEBHOOK_SECRET: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:-dev-webhook-secret}
  HERE_API_KEY: ${HERE_API_KEY:-DEVELOPMENT_MODE}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-DEVELOPMENT_MODE}
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-development-key}
  SERVICE_DISCOVERY_ENABLED: ${SERVICE_DISCOVERY_ENABLED:-true}
  SERVICE_DISCOVERY_SERVICE_NAMES: ${SERVICE_DISCOVERY_SERVICE_NAMES:-auth,catalog,order}
  NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maysar}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-maysar2026}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-maysar}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-maysar2026}
  S3_BUCKET_CHAT_MEDIA: ${S3_BUCKET_CHAT_MEDIA:-chat-media}
  S3_BUCKET_PRODUCT_MEDIA: ${S3_BUCKET_PRODUCT_MEDIA:-product-media}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

services:
  maysar-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: maysar-dtn:latest
    environment:
      <<: *app-env
      SEARCH_PROVIDER: meilisearch
      MEILISEARCH_HOST: meilisearch
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - backend-network
      - database-network
    restart: always
    stop_grace_period: 1m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maysar}
      POSTGRES_USER: ${POSTGRES_USER:-maysar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maysar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maysar} -d ${POSTGRES_DB:-maysar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-maysar}"]
    volumes:
      - redis_data:/data
    networks:
      - database-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-maysar}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
    volumes:
      - meili_data:/meili_data
    networks:
      - backend-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit_data:/data
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend-network
    restart: always

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - backend-network
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    ports:
      - "16686:16686"
      - "4318:4318"
      - "14268:14268"
    networks:
      - backend-network
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maysar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-maysar2026}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console: http://localhost:9001
    networks:
      - backend-network
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Creates the default media buckets on first startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-maysar} ${MINIO_ROOT_PASSWORD:-maysar2026};
        mc mb --ignore-existing local/${S3_BUCKET_CHAT_MEDIA:-chat-media};
        mc anonymous set download local/${S3_BUCKET_CHAT_MEDIA:-chat-media};
        mc mb --ignore-existing local/${S3_BUCKET_PRODUCT_MEDIA:-product-media};
        mc anonymous set download local/${S3_BUCKET_PRODUCT_MEDIA:-product-media};
        echo 'MinIO media buckets ready';
      "
    networks:
      - backend-network
    restart: "no"

networks:
  backend-network:
    driver: bridge
  database-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  meili_data:
  mailpit_data:
  minio_data:
