version: '3.8'

services:
  # =====================================================================================
  # CATALOG SERVICE
  # =====================================================================================
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "${CATALOG_PORT:-3000}:3000"
      - "${METRICS_PORT:-9090}:9090"
    environment:
      # Service Configuration
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - HOST=0.0.0.0
      - SERVICE_NAME=catalog-service
      - SERVICE_VERSION=1.0.0
      - SERVICE_DESCRIPTION=Product Catalog Service

      # Security
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - CORS_CREDENTIALS=true
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=900000
      - JWT_REFRESH_EXPIRATION=604800000
      - ADMIN_ROLES=admin,superuser
      - AUTHZ_RBAC=true

      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - RATE_LIMIT_STRATEGY=fixed

      # Validation
      - VALIDATION_SANITIZE=true
      - MAX_REQUEST_SIZE=10485760

      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json

      # Monitoring
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      - HEALTH_CHECK_INTERVAL=30000
      - HEALTH_CHECK_TIMEOUT=5000

      # Database
      - DATABASE_URL=${DATABASE_URL}

      # Messaging
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_CLIENT_ID=catalog-service
      - KAFKA_GROUP_ID=catalog-service-group

      - RABBITMQ_URL=${RABBITMQ_URL}

      - EVENT_STORE_CONNECTION=memory

      # Topics
      - TOPIC_PRODUCT_EVENTS=catalog.product.events
      - TOPIC_PRICING_EVENTS=catalog.pricing.events
      - TOPIC_SEARCH_EVENTS=catalog.search.events
      - TOPIC_AUDIT_EVENTS=catalog.audit.events

      # External Services
      - CDN_PROVIDER=${CDN_PROVIDER:-cloudflare}
      - CDN_ENABLED=${CDN_ENABLED:-false}
      - CDN_BASE_URL=${CDN_BASE_URL}

      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-elasticsearch}
      - SEARCH_ENABLED=${SEARCH_ENABLED:-false}
      - ELASTICSEARCH_NODE=${ELASTICSEARCH_NODE:-http://elasticsearch:9200}

      - CACHE_PROVIDER=${CACHE_PROVIDER:-redis}
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

      - IMAGE_PROVIDER=sharp
      - IMAGE_ENABLED=true

      - UPLOAD_PROVIDER=local
      - UPLOAD_ENABLED=true
      - UPLOAD_DESTINATION=./uploads

    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - catalog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================================================================
  # DATABASE - POSTGRESQL
  # =====================================================================================
  postgres:
    image: postgres:15-alpine
    container_name: catalog-postgres
    environment:
      - POSTGRES_DB=catalog_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - catalog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================================================================
  # CACHE - REDIS
  # =====================================================================================
  redis:
    image: redis:7-alpine
    container_name: catalog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - catalog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================================================================
  # SEARCH - ELASTICSEARCH (OPTIONAL)
  # =====================================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: catalog-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=changeme
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - catalog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - search

  # =====================================================================================
  # MESSAGING - KAFKA (OPTIONAL)
  # =====================================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: catalog-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - catalog-network
    profiles:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: catalog-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    networks:
      - catalog-network
    restart: unless-stopped
    profiles:
      - kafka

  # =====================================================================================
  # MESSAGING - RABBITMQ (OPTIONAL ALTERNATIVE)
  # =====================================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: catalog-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - catalog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - rabbitmq

  # =====================================================================================
  # MONITORING - PROMETHEUS
  # =====================================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: catalog-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - catalog-network
    restart: unless-stopped
    profiles:
      - monitoring

  # =====================================================================================
  # MONITORING - GRAFANA
  # =====================================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: catalog-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - catalog-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  catalog-network:
    driver: bridge
    name: catalog-network
